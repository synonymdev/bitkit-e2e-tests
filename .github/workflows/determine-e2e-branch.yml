name: Determine E2E branch
on:
  workflow_call:
    inputs:
      app_branch:
        description: "Branch name from the app repo"
        required: true
        type: string
      e2e_branch_input:
        description: "Input override (main | default-feature-branch | custom)"
        required: false
        default: "default-feature-branch"
        type: string
    outputs:
      branch:
        description: "Resolved E2E branch"
        value: ${{ jobs.determine.outputs.branch }}

jobs:
  determine:
    name: determine
    runs-on: ubuntu-latest 
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: Detect branch to use
        id: detect
        shell: bash
        run: |
          APP_BRANCH="${{ inputs.app_branch }}"
          INPUT_BRANCH="${{ inputs.e2e_branch_input }}"
          TEST_REPO="synonymdev/bitkit-e2e-tests"
          CALLER_REPO="${{ github.repository }}"

          # Platform-specific base branch overrides.
          # When a platform needs a different base than 'main', update it here.
          # Set both back to 'main' once platforms are aligned again.
          declare -A BASE_OVERRIDES=(
            ["ios"]="main"
            ["android"]="main"
          )

          PLATFORM=""
          if [[ "$CALLER_REPO" == */bitkit-ios ]]; then
            PLATFORM="ios"
          elif [[ "$CALLER_REPO" == */bitkit-android ]]; then
            PLATFORM="android"
          fi
          BASE_BRANCH="${BASE_OVERRIDES[$PLATFORM]:-main}"

          echo "🧭 App branch: $APP_BRANCH"
          echo "🧭 Input branch: $INPUT_BRANCH"
          echo "🧭 Caller repo: $CALLER_REPO (platform: ${PLATFORM:-unknown})"
          echo "🧭 Base branch: $BASE_BRANCH"
          echo "🧭 Checking repo: $TEST_REPO"

          # --exit-code: 0 = ref exists, 2 = no matching ref. Any other status
          # is a transport/auth failure. resolve-e2e-ref treats "main" as
          # already settled, so a swallowed lookup error here would check out
          # the base branch for the rest of the run.
          ref_lookup_status() {
            local ref="$1"
            local err_file
            local status=0
            err_file="$(mktemp)"
            git ls-remote --exit-code "https://github.com/${TEST_REPO}.git" "refs/heads/${ref}" >/dev/null 2>"$err_file" || status=$?
            if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
              if [[ -s "$err_file" ]]; then
                echo "git ls-remote stderr:"
                cat "$err_file"
              fi
              echo "::error title=E2E ref lookup failed::git ls-remote exited ${status} looking up '${ref}' in ${TEST_REPO}. Not treating this as a missing branch."
              rm -f "$err_file"
              exit 1
            fi
            rm -f "$err_file"
            return "$status"
          }

          if [[ "$INPUT_BRANCH" == "main" ]]; then
            BRANCH="main"
          elif [[ "$INPUT_BRANCH" == "default-feature-branch" ]]; then
            lookup_status=0
            ref_lookup_status "$APP_BRANCH" || lookup_status=$?
            if [[ "$lookup_status" -eq 0 ]]; then
              BRANCH="$APP_BRANCH"
              echo "✅ Found matching branch: $BRANCH"
            else
              BRANCH="$BASE_BRANCH"
              echo "⚠️ No '$APP_BRANCH' branch in $TEST_REPO, using '$BASE_BRANCH'."
            fi
          else
            lookup_status=0
            ref_lookup_status "$INPUT_BRANCH" || lookup_status=$?
            if [[ "$lookup_status" -eq 0 ]]; then
              BRANCH="$INPUT_BRANCH"
            else
              echo "::error title=Invalid e2e_branch::Branch '$INPUT_BRANCH' not found in $TEST_REPO"
              exit 1
            fi
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"